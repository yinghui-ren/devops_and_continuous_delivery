---
# Lab 3 EASY — Task 2: Install or Remove a system package based on ansible tags
# Tags: 'install' or 'remove' determine the action.
#
# Usage:
#   ansible-playbook playbooks/manage-package.yml --tags install
#   ansible-playbook playbooks/manage-package.yml --tags remove

- name: Install or Remove a system package based on ansible tags
  hosts: managed_nodes
  become: yes
  tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install nginx package
      apt:
        name: nginx
        state: present
      tags:
        - install
        - never

    - name: Remove nginx package
      apt:
        name: nginx
        state: absent
        purge: yes
      tags:
        - remove
        - never

    - name: Show install result
      debug:
        msg: "nginx has been INSTALLED on {{ inventory_hostname }}"
      when: "'install' in ansible_run_tags"
      tags:
        - install
        - never

    - name: Show remove result
      debug:
        msg: "nginx has been REMOVED from {{ inventory_hostname }}"
      when: "'remove' in ansible_run_tags"
      tags:
        - remove
        - never
